services:
  - type: web
    name: zenquant-claim-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: COUNTRY_CODE
        value: "880"
      - key: BOT_DOMAIN
        sync: false
